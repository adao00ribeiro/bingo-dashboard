<button (click)="back()">Voltar</button>
<form [formGroup]="form">
  <h2>Configurações do Vendedor</h2>

  <mat-accordion>
    <mat-expansion-panel formGroupName="settings">
      <mat-expansion-panel-header>
        <mat-panel-title>Servidor SMTP</mat-panel-title>
      </mat-expansion-panel-header>

      <div formGroupName="emailConfig">
        <div formGroupName="primarySmtp">
          <mat-list>
            <mat-list-item>
              <mat-form-field>
                <mat-label>Host</mat-label>
                <input matInput formControlName="host" (change)="save()">
              </mat-form-field>
            </mat-list-item>

            <mat-list-item>
              <mat-form-field>
                <mat-label>Porta</mat-label>
                <input type="number" matInput formControlName="port" (change)="save()">
              </mat-form-field>
            </mat-list-item>

            <mat-list-item>
              <mat-form-field>
                <mat-label>Usuário</mat-label>
                <input matInput formControlName="user" (change)="save()">
              </mat-form-field>
            </mat-list-item>

            <mat-list-item>
              <mat-form-field>
                <mat-label>Senha</mat-label>
                <input type="password" matInput formControlName="password" (change)="save()">
              </mat-form-field>
            </mat-list-item>

            <mat-list-item>
              <span>SSL Ativado</span>
              <mat-slide-toggle color="primary" formControlName="enableSsl" (change)="save()">
              </mat-slide-toggle>
            </mat-list-item>
          </mat-list>
        </div>

        <mat-divider></mat-divider>

        <mat-list>
          <mat-list-item>
            <mat-form-field>
              <mat-label>Endereço do Remetente</mat-label>
              <input matInput formControlName="fromAddress" (change)="save()">
            </mat-form-field>
          </mat-list-item>

          <mat-list-item>
            <mat-form-field>
              <mat-label>Nome do Remetente</mat-label>
              <input matInput formControlName="fromName" (change)="save()">
            </mat-form-field>
          </mat-list-item>
        </mat-list>
      </div>
    </mat-expansion-panel>
  </mat-accordion>
  <mat-list-item  formGroupName="settings">
    <span>Habilitar Raspadinha</span>
    <mat-slide-toggle color="primary" formControlName="enabledScratch" (change)="save()">
    </mat-slide-toggle>
  </mat-list-item>
</form>
