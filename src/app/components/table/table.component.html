<div class="container">
  <div class="header">
    <h2>{{title}}</h2>
    @if(enabledBtn){
    <button class="btn-add" (click)="handleClick()">Add</button>
    }
  </div>

<mat-form-field class="input-filter">
  <mat-label>Filter</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium" #input>
</mat-form-field>
<section class="container " tabindex="0">

  <table class="mat-mdc-table" mat-table matSort  [dataSource]="dataSource">
    @for (columns of columnMappings; track $index) {
      <ng-container [matColumnDef]="columns.key">
        <th mat-header-cell *matHeaderCellDef  mat-sort-header>{{columns.displayName }} </th>
        <td mat-cell *matCellDef="let element">

          @if(columnTemplates[columns.key]){
            <ng-container
            *ngTemplateOutlet="columnTemplates[columns.key]; context: { $implicit: element }">
          </ng-container>
          }@else{
          @if(columns.pipe){
            {{ getValue(element, columns.key) | dynamic: columns.pipe }}
          }@else {
            {{ getValue(element, columns.key) }}
          }
        }
        </td>
      </ng-container>
    }
    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="handleDetail(row)"></tr>
  </table>
</section>
<mat-paginator aria-label="Select page of periodic elements" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons>
</mat-paginator>
</div>
